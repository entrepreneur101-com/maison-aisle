<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison Aisle — Walk-in Store</title>
<style>
:root{--bg:#f4ede2;--ink:#1d1a17;--muted:#6f655a;--card:#fffaf2;--accent:#c4552d;--shelf:#d8c8b0;--floor:#e6d9c4;--line:#cdbb9f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16130f;--ink:#f3eadb;--muted:#a79a88;--card:#221d17;--accent:#e8734a;--shelf:#3a3026;--floor:#1e1913;--line:#3a3026}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16130f;--ink:#f3eadb;--muted:#a79a88;--card:#221d17;--accent:#e8734a;--shelf:#3a3026;--floor:#1e1913;--line:#3a3026}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;pointer-events:none}
.bar b{font-family:Georgia,serif;font-size:18px;letter-spacing:.04em;background:var(--bg);padding:4px 10px;border-radius:99px;pointer-events:auto}
.bar .r{display:flex;gap:8px;pointer-events:auto}
.pill{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:8px 14px;font-size:14px}
.pill.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* entrance */
.entry{height:100vh;height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 60%,#ffd9a0,#c4552d 70%);perspective:1200px}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transform-origin:50% 62%}
.sign{font-family:Georgia,serif;font-size:clamp(28px,6vw,64px);color:#fff;background:#1d1a17;padding:14px 36px;border-radius:6px;letter-spacing:.08em;z-index:3}
.awning{width:min(760px,96vw);height:70px;background:repeating-linear-gradient(90deg,#c4552d 0 44px,#f4ede2 44px 88px);border-radius:0 0 40px 40px;z-index:2;box-shadow:0 10px 20px #0004}
.front{width:min(700px,92vw);height:62vh;background:#2b2520;position:relative;display:flex;justify-content:center;border:10px solid #1d1a17;border-bottom:0}
.door{width:50%;height:100%;background:linear-gradient(#5a6b73aa,#9db1b8aa);border:6px solid #1d1a17;position:relative;z-index:2}
.door.l{transform-origin:0 50%}.door.r{transform-origin:100% 50%}
.door::after{content:"";position:absolute;top:50%;width:8px;height:60px;background:#e8c36a;border-radius:4px}
.door.l::after{right:14px}.door.r::after{left:14px}
.inside{position:absolute;inset:0;background:linear-gradient(#ffe9c2,#f4c98a)}
.hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:13px;letter-spacing:.2em;text-transform:uppercase;z-index:5}
/* floor plan */
.mapwrap{min-height:100vh;padding:clamp(80px,12vh,110px) 4vw 8vh;background:var(--floor);display:flex;flex-direction:column;align-items:center}
.mapwrap h2{font-family:Georgia,serif;font-size:clamp(30px,6vw,56px);font-weight:400;text-align:center}
.mapwrap>p{color:var(--muted);margin:8px 0 22px;text-align:center}
.plan{position:relative;width:min(920px,100%);height:min(74vh,660px);min-height:480px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 74px;gap:clamp(14px,3vw,34px);padding:clamp(14px,3vw,30px);border:8px solid var(--ink);border-bottom-width:0;border-radius:18px 18px 0 0;background:repeating-linear-gradient(0deg,transparent 0 59px,var(--line) 59px 60px),repeating-linear-gradient(90deg,transparent 0 59px,var(--line) 59px 60px),var(--card)}
.zone{position:relative;border:0;border-radius:14px;text-align:left;padding:clamp(12px,2vw,22px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#1d1a17;transition:transform .25s,box-shadow .25s}
.zone:hover,.zone:focus-visible{transform:translateY(-4px) scale(1.015);box-shadow:0 14px 30px #0003;outline:3px solid var(--accent)}
.zone b{font-family:Georgia,serif;font-size:clamp(22px,4vw,38px);font-weight:400;line-height:1}
.zone small{display:block;margin-top:6px;font-size:13px;opacity:.75;max-width:22ch}
.zone .go{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.mini{display:flex;gap:8px;align-items:flex-end;border-bottom:6px solid #0003;padding-bottom:4px;width:max-content}
.mini i{display:block;background:rgba(255,255,255,.6);width:clamp(18px,4vw,34px);height:clamp(18px,4vw,34px)}
.door-row{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-end}
.entrance{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:110px;height:14px;background:var(--accent);border-radius:4px;font-size:0}
.counterbtn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:12px 18px;font-size:14px;align-self:flex-end}
.legend{align-self:flex-end;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.me{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 6px #c4552d44;z-index:5;transition:left .9s ease-in-out,top .9s ease-in-out;pointer-events:none}
.entlabel{margin-top:10px;color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
/* room */
.room{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;overflow:auto;padding:calc(70px + env(safe-area-inset-top,0px)) 5vw calc(24px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .35s}
.room.open{display:flex}.room.show{opacity:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{border:1px solid #1d1a1744;background:#fffa;color:#1d1a17;border-radius:99px;padding:8px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:#1d1a17;color:#fff}
.room h2{font-family:Georgia,serif;font-size:clamp(44px,10vw,120px);font-weight:400;line-height:.95;margin-top:3vh;color:#1d1a17}
.room p{color:#1d1a17b0;margin-top:8px}
.shelf{display:flex;gap:clamp(14px,2.5vw,32px);margin-top:auto;padding:5vh 0 14px;border-bottom:12px solid #0003;overflow-x:auto}
.item{background:var(--card);color:var(--ink);border-radius:14px;padding:12px;flex:0 0 clamp(150px,26vw,270px);box-shadow:0 8px 24px #0002;transition:transform .3s}
.item:hover{transform:translateY(-10px) rotate(-1deg)}
.pic{height:clamp(110px,22vh,200px);border-radius:10px;display:grid;place-items:center}
.pic i{display:block;background:rgba(255,255,255,.55);box-shadow:inset 0 -8px 0 #0002}
.item h3{font-size:15px;margin:10px 0 2px;font-weight:600}
.item span{font-size:13px;color:var(--muted)}
.item button{margin-top:8px;width:100%;border:0;background:var(--accent);color:#fff;padding:9px;border-radius:8px;font-size:13px}
.item button.on{background:var(--ink);color:var(--bg)}
.walk{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
.walk button{background:#1d1a17;color:#fff;border:0;border-radius:99px;padding:11px 18px;font-size:14px}
.walk button.alt{background:#fffa;color:#1d1a17;border:1px solid #1d1a1744}
/* aisle */
.aisle{height:100vh;height:100svh;overflow:hidden;position:relative;background:linear-gradient(var(--bg) 62%,var(--floor) 62%)}
.track{display:flex;height:100%;width:max-content}
.az{width:100vw;height:100%;padding:clamp(80px,14vh,130px) 6vw 0;display:flex;flex-direction:column;position:relative}
.az h2{font-family:Georgia,serif;font-size:clamp(40px,9vw,110px);line-height:.95;font-weight:400;position:relative;z-index:1}
.az p{color:var(--muted);margin:10px 0 0;max-width:36ch;position:relative;z-index:1}
.ghost{position:absolute;top:8vh;left:3vw;font-family:Georgia,serif;font-size:clamp(120px,28vw,380px);color:var(--shelf);opacity:.35;white-space:nowrap;user-select:none}
.ashelf{display:flex;gap:clamp(14px,2.5vw,32px);margin-top:auto;margin-bottom:12vh;padding-bottom:14px;border-bottom:10px solid var(--shelf);position:relative;z-index:1}
.prog{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:6vw;right:6vw;height:3px;background:var(--shelf);z-index:5}
.prog div{height:100%;width:0;background:var(--accent)}
/* checkout */
.checkout{min-height:80vh;display:grid;place-items:center;text-align:center;padding:12vh 6vw}
.counter{background:var(--card);border-radius:20px;padding:40px clamp(24px,6vw,64px);max-width:520px;box-shadow:0 20px 50px #0002}
.counter h2{font-family:Georgia,serif;font-size:clamp(32px,6vw,52px);font-weight:400}
.counter p{color:var(--muted);margin:12px 0 24px}
.counter a{display:inline-block;background:var(--ink);color:var(--bg);padding:14px 28px;border-radius:99px;text-decoration:none}
</style>
</head>
<body>
<div class="bar"><b>Maison Aisle</b><div class="r"><button class="pill alt" id="mapbtn">Store map</button><button class="pill" id="bag">Bag · 0</button></div></div>

<section class="entry" id="entry">
  <div class="inside"></div>
  <div class="scene" id="scene">
    <div class="sign">MAISON AISLE</div><div class="awning"></div>
    <div class="front"><div class="door l" id="dl"></div><div class="door r" id="dr"></div></div>
  </div>
  <div class="hint" id="hint">Scroll to step inside</div>
</section>

<section class="mapwrap" id="map">
  <h2>You’re inside. Where to?</h2>
  <p>Tap any section to walk straight over, or keep scrolling to stroll the aisle.</p>
  <div class="plan" id="plan">
    <div class="door-row"><span class="legend">Floor plan</span><button class="counterbtn" id="tocheckout">Checkout counter →</button></div>
    <div class="entrance"></div><div class="me" id="me"></div>
  </div>
  <div class="entlabel">▲ Entrance</div>
</section>

<section class="aisle" id="aisle">
  <div class="track" id="track"></div>
  <div class="prog"><div id="pbar"></div></div>
</section>

<section class="checkout" id="checkout">
  <div class="counter">
    <h2>Ready to check out?</h2>
    <p id="sum">Your bag is empty. Take another stroll through the store.</p>
    <a href="#map">Back to the map</a>
  </div>
</section>

<div class="room" id="room">
  <div class="chips" id="chips"></div>
  <h2 id="rt"></h2><p id="rd"></p>
  <div class="shelf" id="rs"></div>
  <div class="walk"><button class="alt" id="back">← Store map</button><button id="next">Next section →</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
var Z=[
 {n:"New In",d:"Fresh arrivals, just unboxed.",g:["#f2b5a0","#e8734a"],items:[["Linen Shirt",64],["Canvas Tote",38],["Sun Hat",29]]},
 {n:"Home",d:"Small things that make a room.",g:["#b9cdb5","#6f9a7a"],items:[["Clay Vase",48],["Soy Candle",22],["Wool Throw",85]]},
 {n:"Accessories",d:"Finishing touches, worn daily.",g:["#c9bfe6","#7d6bb5"],items:[["Leather Belt",45],["Silk Scarf",52],["Brass Ring",31]]},
 {n:"Gifts",d:"Wrapped and ready to go.",g:["#f4dd9a","#d9a93a"],items:[["Tea Set",58],["Notebook Duo",18],["Mini Plant",16]]}
];
var SH=["border-radius:50%;width:56%;height:78%","border-radius:14px;width:62%;height:62%","border-radius:40px 40px 10px 10px;width:48%;height:80%"];
var $=function(i){return document.getElementById(i)},bag={},cur=0,lenis=null,plan=$("plan"),me=$("me");
function bagSync(){var n=Object.keys(bag),t=0;n.forEach(function(k){t+=bag[k]});
  $("bag").textContent="Bag · "+n.length;
  $("sum").textContent=n.length?n.length+" item"+(n.length>1?"s":"")+" in your bag · $"+t:"Your bag is empty. Take another stroll through the store.";
  document.querySelectorAll("button[data-n]").forEach(function(b){var on=b.dataset.n in bag;b.classList.toggle("on",on);b.textContent=on?"In your bag ✓":"Add to bag"})}
/* build plan zones */
Z.forEach(function(z,i){
  var b=document.createElement("button");b.className="zone";b.dataset.i=i;b.style.background="linear-gradient(135deg,"+z.g[0]+","+z.g[1]+")";
  var m="";z.items.forEach(function(_,k){m+='<i style="'+SH[(i+k)%3]+'"></i>'});
  b.innerHTML='<div><b>'+z.n+'</b><small>'+z.d+'</small></div><div><div class="mini">'+m+'</div><div class="go" style="margin-top:10px">Walk over →</div></div>';
  plan.insertBefore(b,plan.querySelector(".door-row"));
});
function center(el){var p=plan.getBoundingClientRect(),r=el.getBoundingClientRect();return[r.left-p.left+r.width/2,r.top-p.top+r.height/2]}
function home(){me.style.transition="none";me.style.left=plan.clientWidth/2+"px";me.style.top=plan.clientHeight+"px";void me.offsetWidth;me.style.transition=""}
home();window.addEventListener("resize",home);
/* room */
function render(i){cur=i;var z=Z[i],r=$("room");
  r.style.background="linear-gradient(160deg,"+z.g[0]+","+z.g[1]+")";
  $("rt").textContent=z.n;$("rd").textContent=z.d;
  $("chips").innerHTML=Z.map(function(q,k){return '<button class="chip'+(k===i?' on':'')+'" data-c="'+k+'">'+q.n+'</button>'}).join("");
  $("rs").innerHTML=z.items.map(function(it,k){return '<div class="item"><div class="pic" style="background:linear-gradient(135deg,'+z.g[0]+','+z.g[1]+')"><i style="'+SH[(i+k)%3]+'"></i></div><h3>'+it[0]+'</h3><span>$'+it[1]+'</span><button data-n="'+it[0]+'" data-p="'+it[1]+'">Add to bag</button></div>'}).join("");
  $("next").textContent=i<Z.length-1?"Next: "+Z[i+1].n+" →":"To checkout →";
  bagSync();r.scrollTop=0}
function openRoom(i){render(i);var r=$("room");r.classList.add("open");requestAnimationFrame(function(){r.classList.add("show")});document.body.style.overflow="hidden";if(lenis)lenis.stop()}
function closeRoom(cb){var r=$("room");r.classList.remove("show");setTimeout(function(){r.classList.remove("open");document.body.style.overflow="";if(lenis)lenis.start();if(cb)cb()},300)}
function toEl(id){var e=$(id);if(lenis)lenis.scrollTo(e,{offset:0});else e.scrollIntoView({behavior:"smooth"})}
document.addEventListener("click",function(e){
  var t=e.target,b;
  if(b=t.closest("button[data-n]")){var n=b.dataset.n;if(n in bag)delete bag[n];else bag[n]=+b.dataset.p;bagSync();return}
  if(b=t.closest(".zone")){var c=center(b);me.style.left=c[0]+"px";me.style.top=c[1]+"px";setTimeout(function(){openRoom(+b.dataset.i)},950);return}
  if(b=t.closest(".chip")){render(+b.dataset.c);return}
  if(t.closest("#back"))return closeRoom(function(){toEl("map")});
  if(t.closest("#next")){if(cur<Z.length-1)render(cur+1);else closeRoom(function(){toEl("checkout")});return}
  if(t.closest("#mapbtn")){if($("room").classList.contains("open"))closeRoom(function(){toEl("map")});else toEl("map");return}
  if(t.closest("#bag")){if($("room").classList.contains("open"))closeRoom(function(){toEl("checkout")});else toEl("checkout");return}
  if(t.closest("#tocheckout"))toEl("checkout");
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("room").classList.contains("open"))closeRoom()});
var tr=$("track");
Z.forEach(function(z,i){var s=document.createElement("div");s.className="az";
  var h='<div class="ghost">'+z.n+'</div><h2>'+z.n+'</h2><p>'+z.d+'</p><div class="ashelf">';
  z.items.forEach(function(it,k){h+='<div class="item"><div class="pic" style="background:linear-gradient(135deg,'+z.g[0]+','+z.g[1]+')"><i style="'+SH[(i+k)%3]+'"></i></div><h3>'+it[0]+'</h3><span>$'+it[1]+'</span><button data-n="'+it[0]+'" data-p="'+it[1]+'">Add to bag</button></div>'});
  s.innerHTML=h+'</div>';tr.appendChild(s)});
bagSync();
if(window.gsap&&window.ScrollTrigger){
  gsap.registerPlugin(ScrollTrigger);
  if(window.Lenis){lenis=new Lenis();lenis.on("scroll",ScrollTrigger.update);gsap.ticker.add(function(t){lenis.raf(t*1000)});gsap.ticker.lagSmoothing(0)}
  gsap.timeline({scrollTrigger:{trigger:"#entry",start:"top top",end:"+=120%",scrub:.6,pin:true}})
    .to("#hint",{opacity:0,duration:.1},0)
    .to("#dl",{rotateY:-100,duration:.5},.1).to("#dr",{rotateY:100,duration:.5},.1)
    .to("#scene",{scale:4.5,duration:1},.4).to("#scene",{opacity:0,duration:.3},1.1);
  gsap.from(".zone",{y:50,opacity:0,stagger:.12,duration:.7,scrollTrigger:{trigger:"#plan",start:"top 80%"}});
  var dist=function(){return tr.scrollWidth-window.innerWidth};
  gsap.to(tr,{x:function(){return -dist()},ease:"none",scrollTrigger:{trigger:"#aisle",start:"top top",end:function(){return "+="+dist()},scrub:.6,pin:true,invalidateOnRefresh:true,onUpdate:function(s){$("pbar").style.width=(s.progress*100)+"%"}}});
  gsap.utils.toArray(".ghost").forEach(function(g){gsap.to(g,{x:-120,ease:"none",scrollTrigger:{trigger:"#aisle",start:"top top",end:function(){return "+="+dist()},scrub:true}})});
}
</script>
</body>
</html>
